<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividade DOM Interativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1e1e2e;
    --panel: #262637;
    --panel-border: #3a3a52;
    --text: #cdd6f4;
    --text-dim: #8b8bab;
    --blue: #89b4fa;
    --green: #a6e3a1;
    --yellow: #f9e2af;
    --pink: #f38ba8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    padding: 40px 20px 80px;
  }

  header {
    max-width: 640px;
    margin: 0 auto 36px;
  }

  header .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  header h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 700;
    margin: 6px 0 0;
    color: var(--text);
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .bloco {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-left: 3px solid var(--accent, var(--blue));
    border-radius: 6px;
    padding: 22px 24px;
  }

  .bloco h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 500;
    color: var(--accent, var(--blue));
    margin: 0 0 16px;
  }

  #secao-contador { --accent: var(--blue); }
  #secao-texto    { --accent: var(--green); }
  #secao-itens    { --accent: var(--yellow); }
  #secao-reset    { --accent: var(--pink); }

  button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    border: 1px solid var(--panel-border);
    background: #1e1e2e;
    color: var(--text);
    border-radius: 5px;
    padding: 9px 16px;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }

  button:hover { border-color: var(--accent, var(--blue)); }
  button:active { transform: scale(0.97); }

  input[type="text"], select {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    background: #1e1e2e;
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 5px;
    padding: 9px 12px;
    outline: none;
  }

  input[type="text"]:focus, select:focus {
    border-color: var(--accent, var(--blue));
  }

  /* Contador de cliques */
  .contador-area {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .contador-area button {
    width: 40px;
    height: 40px;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #valorContador {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    min-width: 40px;
    text-align: center;
  }

  /* Texto dinâmico */
  #secao-texto input[type="text"] { width: 100%; }

  .info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    margin: 12px 0 4px;
  }

  .info span { color: var(--green); }

  #listaParagrafos { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }

  .paragrafo-adicionado {
    background: #1e1e2e;
    border: 1px solid var(--panel-border);
    border-radius: 5px;
    padding: 10px 14px;
    margin: 0;
    font-size: 14px;
  }

  /* Itens / listas */
  .linha-controles {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .linha-controles select { flex: 0 0 auto; }
  .linha-controles input[type="text"] { flex: 1 1 160px; }

  #areaListas { margin-top: 16px; display: flex; flex-direction: column; gap: 14px; }

  .lista-gerada {
    background: #1e1e2e;
    border: 1px solid var(--panel-border);
    border-radius: 5px;
    padding: 12px 14px 12px 32px;
    margin: 0;
  }

  .lista-gerada li { font-size: 14px; margin-bottom: 4px; }

  /* Reset */
  #secao-reset {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  #secao-reset p {
    margin: 0;
    font-size: 13px;
    color: var(--text-dim);
  }

  #btnReset {
    border-color: var(--pink);
    color: var(--pink);
  }

  #btnReset:hover { background: rgba(243, 139, 168, 0.1); }
</style>
</head>
<body>

<header>
  <div class="tag">// atividade prática — manipulação do DOM</div>
  <h1>Página Interativa</h1>
</header>

<main>

  <!-- 1. Contador de cliques -->
  <section id="secao-contador" class="bloco">
    <h2>// contador de cliques</h2>
    <div class="contador-area">
      <button id="btnDecrementar" aria-label="Diminuir">−</button>
      <span id="valorContador">0</span>
      <button id="btnIncrementar" aria-label="Aumentar">+</button>
    </div>
  </section>

  <!-- 2 e 3. Texto dinâmico + contador de caracteres -->
  <section id="secao-texto" class="bloco">
    <h2>// texto dinâmico</h2>
    <input type="text" id="campoTexto" placeholder="Digite uma mensagem e pressione Enter">
    <p class="info">caracteres (sem espaços): <span id="contadorCaracteres">0</span></p>
    <div id="listaParagrafos"></div>
  </section>

  <!-- 4. Adicionar novo item -->
  <section id="secao-itens" class="bloco">
    <h2>// adicionar novo item</h2>
    <div class="linha-controles">
      <select id="tipoLista">
        <option value="ol">Lista ordenada</option>
        <option value="ul">Lista não ordenada</option>
      </select>
      <input type="text" id="campoItem" placeholder="Texto do item">
      <button id="btnAdicionarItem">Adicionar item</button>
    </div>
    <div id="areaListas"></div>
  </section>

  <!-- 5. Reset -->
  <section id="secao-reset" class="bloco">
    <p>Limpa contador, parágrafos e listas.</p>
    <button id="btnReset">Resetar tudo</button>
  </section>

</main>

<script>
  /* ==========================================================
     1) BUSCAR ELEMENTOS NA ÁRVORE DOM E GUARDAR EM VARIÁVEIS
     ========================================================== */
  const btnIncrementar      = document.getElementById('btnIncrementar');
  const btnDecrementar      = document.getElementById('btnDecrementar');
  const valorContador       = document.getElementById('valorContador');

  const campoTexto          = document.getElementById('campoTexto');
  const contadorCaracteres  = document.getElementById('contadorCaracteres');
  const listaParagrafos     = document.getElementById('listaParagrafos');

  const tipoLista           = document.getElementById('tipoLista');
  const campoItem           = document.getElementById('campoItem');
  const btnAdicionarItem    = document.getElementById('btnAdicionarItem');
  const areaListas          = document.getElementById('areaListas');

  const btnReset            = document.getElementById('btnReset');

  /* Estado guardado em variáveis (fora do DOM, na memória do JS) */
  let contador = 0;
  let listaOrdenadaAtual = null;     // referência ao <ol> em uso, se existir
  let listaNaoOrdenadaAtual = null;  // referência ao <ul> em uso, se existir

  /* ==========================================================
     2) CONTADOR DE CLIQUES
     ========================================================== */
  btnIncrementar.addEventListener('click', function () {
    contador = contador + 1;
    valorContador.textContent = contador; // acessando/alterando conteúdo do elemento
  });

  btnDecrementar.addEventListener('click', function () {
    if (contador > 0) {
      contador = contador - 1;
      valorContador.textContent = contador;
    } else {
      alert('O contador já está em zero!');
    }
  });

  /* ==========================================================
     3) CONTADOR DE CARACTERES EM TEMPO REAL (sem espaços)
     ========================================================== */
  campoTexto.addEventListener('input', function () {
    const textoDigitado = campoTexto.value;
    const semEspacos = textoDigitado.split(' ').join(''); // remove todos os espaços
    contadorCaracteres.textContent = semEspacos.length;
  });

  /* ==========================================================
     2 (continuação)) TEXTO DINÂMICO — Enter cria um parágrafo
     ========================================================== */
  campoTexto.addEventListener('keydown', function (evento) {
    if (evento.key === 'Enter') {
      const texto = campoTexto.value.trim();

      if (texto === '') {
        return; // estrutura de controle: não cria parágrafo vazio
      }

      const novoParagrafo = document.createElement('p');
      novoParagrafo.textContent = texto;
      novoParagrafo.classList.add('paragrafo-adicionado');
      listaParagrafos.appendChild(novoParagrafo);

      campoTexto.value = '';
      contadorCaracteres.textContent = '0';
    }
  });

  /* ==========================================================
     4) ADICIONAR NOVO ITEM (lista ordenada ou não ordenada)
     ========================================================== */
  function adicionarItem() {
    const texto = campoItem.value.trim();

    if (texto === '') {
      alert('Digite um texto para o item antes de adicionar.');
      return;
    }

    const tipo = tipoLista.value; // 'ol' ou 'ul', conforme o <select>
    let listaAlvo;

    if (tipo === 'ol') {
      if (!listaOrdenadaAtual) {
        listaOrdenadaAtual = document.createElement('ol');
        listaOrdenadaAtual.classList.add('lista-gerada');
        areaListas.appendChild(listaOrdenadaAtual);
      }
      listaAlvo = listaOrdenadaAtual;
    } else {
      if (!listaNaoOrdenadaAtual) {
        listaNaoOrdenadaAtual = document.createElement('ul');
        listaNaoOrdenadaAtual.classList.add('lista-gerada');
        areaListas.appendChild(listaNaoOrdenadaAtual);
      }
      listaAlvo = listaNaoOrdenadaAtual;
    }

    const novoItem = document.createElement('li');
    novoItem.textContent = texto;
    listaAlvo.appendChild(novoItem);

    campoItem.value = '';
    campoItem.focus();
  }

  btnAdicionarItem.addEventListener('click', adicionarItem);

  campoItem.addEventListener('keydown', function (evento) {
    if (evento.key === 'Enter') {
      adicionarItem();
    }
  });

  /* ==========================================================
     5) BOTÃO DE RESET — limpa todas as interações
     ========================================================== */
  btnReset.addEventListener('click', function () {
    contador = 0;
    valorContador.textContent = contador;

    campoTexto.value = '';
    contadorCaracteres.textContent = '0';
    listaParagrafos.innerHTML = '';

    areaListas.innerHTML = '';
    listaOrdenadaAtual = null;
    listaNaoOrdenadaAtual = null;

    campoItem.value = '';
  });
</script>

</body>
</html>
